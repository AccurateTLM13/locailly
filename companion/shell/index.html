<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Locaily</title>
    <link rel="stylesheet" href="/shell/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>⚡</text></svg>">
  </head>
  <body>
    <div class="shell">
      <header class="shell-topbar">
        <div class="shell-topbar__brand">
          <img src="/console/assets/locaily-logo.svg" alt="Locaily" class="shell-topbar__logo" width="100" height="24">
        </div>
        <div class="shell-topbar__status" id="shellStatus">
          <span class="status-dot" id="shellStatusDot"></span>
          <span class="status-label" id="shellStatusLabel">Loading…</span>
        </div>
      </header>
      <div class="shell-body">
        <nav class="shell-nav">
          <ul class="shell-nav__list" id="shellNav">
            <li><a href="#home" class="shell-nav__link shell-nav__link--active" data-section="home">Home</a></li>
            <li><a href="#runs" class="shell-nav__link" data-section="runs">Runs</a></li>
            <li><a href="#workflows" class="shell-nav__link" data-section="workflows">Workflows</a></li>
            <li><a href="#capabilities" class="shell-nav__link" data-section="capabilities">Capabilities</a></li>
            <li><a href="#models" class="shell-nav__link" data-section="models">Models</a></li>
            <li><a href="#nodes" class="shell-nav__link" data-section="nodes">Nodes</a></li>
            <li><a href="#evidence" class="shell-nav__link" data-section="evidence">Evidence</a></li>
            <li><a href="#reviews" class="shell-nav__link" data-section="reviews">Reviews</a></li>
            <li><a href="#memory" class="shell-nav__link" data-section="memory">Memory</a></li>
            <li><a href="#jobs" class="shell-nav__link" data-section="jobs">Jobs</a></li>
            <li><a href="#settings" class="shell-nav__link" data-section="settings">Settings</a></li>
          </ul>
        </nav>
        <main class="shell-content" id="shellContent">
          <div class="shell-loading" id="shellLoading">Loading section…</div>
          <div id="shellSection"></div>
        </main>
      </div>
    </div>
    <script src="/shell/app.js"></script>
  </body>
</html>
